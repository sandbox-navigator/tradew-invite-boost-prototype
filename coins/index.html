<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>金币 · TradeW</title>
  <link rel="stylesheet" href="css/styles.css?v=24" />
</head>
<body>
  <div class="app-page">
    <aside class="proto-panel" aria-label="原型控制">
      <div class="proto-row">
        <b>国家</b>
        <button type="button" data-country="id">印尼</button>
        <button type="button" data-country="in">印度</button>
        <button type="button" data-country="ng">尼日利亚</button>
      </div>
      <div class="proto-row">
        <b>状态</b>
        <button type="button" data-sim="new0">未交易 · 0</button>
        <button type="button" data-sim="first">今日首笔 · 待领 60</button>
        <button type="button" data-sim="mid">还差一截 · 320</button>
        <button type="button" data-sim="ready">可兑换 · 800</button>
        <button type="button" data-sim="rich">金币很多 · 10,000</button>
        <button type="button" data-sim="soldout">主推兑完</button>
        <button type="button" data-sim="achieved">目标已达成</button>
        <button type="button" data-sim="nextgoal">待选下一目标</button>
        <button type="button" data-sim="blocked">不计金币</button>
        <button type="button" data-sim="reset">重置</button>
      </div>
      <p class="proto-hint">目标已达成后可选下一个奖励，暂时不选则首页留空。兑换其他商品不会清掉当前目标。</p>
    </aside>

    <div class="device" id="device">
      <div class="status-bar">
        <span>9:41</span>
        <span class="icons" aria-hidden="true">
          <svg width="17" height="12" viewBox="0 0 17 12"><rect x="0" y="7" width="3" height="5" rx="0.5"/><rect x="4.5" y="5" width="3" height="7" rx="0.5"/><rect x="9" y="2.5" width="3" height="9.5" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M1 4.5C3.8 2 6.9 1 8 1s4.2 1 7 3.5" stroke="#000" stroke-width="1.4" stroke-linecap="round"/><path d="M3.6 7C5.3 5.6 6.8 5 8 5s2.7.6 4.4 2" stroke="#000" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="10.2" r="1.3" fill="#000"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="1" width="21" height="10" rx="2.2" stroke="#000" fill="none"/><rect x="2" y="2.5" width="16" height="7" rx="1.2" fill="#000"/><rect x="22.5" y="3.5" width="1.6" height="5" rx="0.6" fill="#000"/></svg>
        </span>
      </div>
      <div id="app" class="stage"></div>
      <div class="home-bar" aria-hidden="true"></div>
      <div id="toast" class="toast" hidden role="status"></div>
    </div>
  </div>
  <script src="js/app.js?v=32"></script>
</body>
</html>
